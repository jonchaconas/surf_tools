# Publishes the Predictive Surf Atlas (web/) to the gh-pages branch whenever it changes on main.
# GitHub Pages serves that branch: Settings → Pages → Deploy from a branch → gh-pages, / (root).
name: Atlas on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # web/index.html has no document skeleton (the artifact host and `surfmap gui` add one);
      # wrap it the same way surfmap/gui.py does.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/data _site/data
          {
            printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            printf '%s' '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>'
            cat web/index.html
          } > _site/index.html
          touch _site/.nojekyll
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the atlas from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
