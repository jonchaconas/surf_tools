# Publishes the Predictive Surf Atlas (web/) to the gh-pages branch whenever it changes on main, and
# every morning with a fresh 7-day forecast (surfmap/forecast.py). GitHub Pages serves that branch.
# Optional repository secrets COPERNICUSMARINE_SERVICE_USERNAME / _PASSWORD let the forecast use
# Copernicus Marine (the climate record's own model); without them it uses Open-Meteo for waves.
name: Atlas on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "40 10 * * *"  # daily, once the overnight model runs are out
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Forecast for the coming week
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: uv run python -m surfmap forecast || echo "::warning::forecast failed; publishing the last committed one"
      # web/index.html has no document skeleton (the artifact host and `surfmap gui` add one);
      # wrap it the same way surfmap/gui.py does.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/data _site/data
          {
            printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            printf '%s' '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>'
            cat web/index.html
          } > _site/index.html
          touch _site/.nojekyll
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the atlas from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
