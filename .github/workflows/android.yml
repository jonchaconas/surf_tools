# Builds the Android app (android/: the atlas's GitHub Pages site in a WebView) and commits the APK
# to android/predictive-surf-atlas.apk, so it can be downloaded straight from the repository.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "!android/*.apk", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        run: gradle -p android assembleDebug
      - name: Commit the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/predictive-surf-atlas.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/predictive-surf-atlas.apk
          git diff --cached --quiet && exit 0
          git commit -q -m "Android app: build of ${GITHUB_SHA::7}"
          git pull -q --rebase && git push -q
