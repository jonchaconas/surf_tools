plugins {
    id "com.android.application"
}

android {
    namespace "io.github.jonchaconas.surfatlas"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.jonchaconas.surfatlas"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"
    }

    // A fixed key (android/debug.keystore, the standard debug passwords) so each new build installs
    // over the last one. It only identifies this sideloaded app; it isn't a store release key.
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}
